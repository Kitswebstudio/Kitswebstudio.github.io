function price(){const j=$('#qj'),p=$('#qp');if(!j)return;const f=()=>{const [n,lo,hi]=D.prices[+j.value],m=+p.value;const r=x=>'£'+(Math.round(x*m/10)*10).toLocaleString('en-GB');$('#qo').textContent=`${r(lo)} – ${r(hi)}`;};j.oninput=p.oninput=f;f();}
function render(){nav();$('#app').innerHTML=`<div class="page">${(P[page]||P.home)()}</div>`;document.querySelectorAll('.card,.qtile').forEach(tiltOn);if(page==='home'){mountHero();mountFeature();price();counters();}else if(heroStop){heroStop();heroStop=null;}reveal();}
if(D.layout==='callout'){const u=$('#util');u.hidden=false;u.innerHTML=`<div class="in"><span>${ic('phone',14)} <b>${esc(D.phone)}</b></span><span>${ic('clock',14)} ${esc(D.hours)}</span><span>${ic('pin',14)} Covering ${esc(D.area)} and nearby</span></div>`;}
if(D.layout==='callout'||D.layout==='shop'){const m=$('#mbar');m.hidden=false;document.body.classList.add('has-mbar');m.innerHTML=D.layout==='callout'?`<button class="btn" data-go="contact">Call now</button><button class="btn ghost" data-go="book">Free quote</button>`:`<button class="btn" data-go="book">Book now</button><button class="btn ghost" data-go="prices">Prices</button>`;}
$('#foot').innerHTML=`<div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px"><div><b style="font-family:var(--disp);color:var(--fg)">${esc(D.name)}</b><br>${esc(D.trade)} · ${esc(D.area)}</div><div>${esc(D.phone)}<br>[Company details to confirm]</div></div>`;
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){if(g.dataset.go==='book'){wiz={step:g.dataset.job?1:0,job:g.dataset.job||null,when:null,pc:''};}page=g.dataset.go;menuOpen=false;ddOpen=false;render();scrollTo({top:0,behavior:still?'auto':'smooth'});return;}
 if(e.target.closest('#burger')){menuOpen=!menuOpen;nav();return;}if(e.target.closest('#ddBtn')){ddOpen=!ddOpen;nav();return;}
 const j=e.target.closest('[data-job]');if(j&&page==='book'){wiz.job=j.dataset.job;wiz.step=1;render();return;}
 const w=e.target.closest('[data-when]');if(w){wiz.when=w.dataset.when;wiz.step=2;render();return;}
 if(e.target.id==='wBack'){wiz.step=Math.max(0,wiz.step-1);render();return;}
 if(ddOpen&&!e.target.closest('.dd')){ddOpen=false;nav();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.card[data-go]'))e.target.click();});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;
 if(id==='pc'){const v=$('#pcIn').value.trim().toUpperCase().replace(/\s+/g,' ');const ok=D.postcodes.some(p=>new RegExp('^'+p+'\\d').test(v));$('#radar').classList.toggle('hit',ok&&!!v);$('#pcOut').innerHTML=!v?'Type a postcode first.':ok?`<b>${esc(v)}</b> is in our area. Book a quote and we'll be in touch.`:`<b>${esc(v)}</b> looks outside our usual area, but give us a call and we'll see.`;}
 if(id==='wpc'){wiz.pc=$('#wpcIn').value.trim().toUpperCase();if(!wiz.pc){toast('Add a postcode to continue');return;}wiz.step=3;render();}
 if(id==='wfin'||id==='cf')toast('Demo only: on the live site this goes straight to the business');});
const glow=$('#glow');if(!still&&matchMedia('(pointer:fine)').matches)addEventListener('pointermove',e=>{glow.style.left=e.clientX+'px';glow.style.top=e.clientY+'px';});else glow.hidden=true;
render();
})();
</script>
</body>
</html>
